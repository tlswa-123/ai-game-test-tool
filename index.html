
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI游戏测评</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafaf9;--card:#fff;--border:#e7e5e4;--text:#1c1917;--dim:#78716c;--light:#a8a29e;--accent:#ea580c;--abg:#fff7ed;--abr:#fed7aa;--dark:#1c1917;--green:#166534;--gbg:#dcfce7;--yellow:#92400e;--ybg:#fef3c7;--red:#dc2626;--rbg:#fef2f2;--blue:#1e40af;--bbg:#dbeafe}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;padding:32px 40px}
.w{max-width:100%;margin:0 auto;display:flex;gap:0}
.main{flex:1;min-width:0;max-width:100%;padding-right:14px}
.side{width:380px;flex-shrink:0;position:sticky;top:12px;height:calc(100vh - 24px);overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;line-height:1.7}
.side::-webkit-scrollbar{width:3px}.side::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.side h3{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:8px}
.side h4{font-size:14px;font-weight:600;margin:8px 0 3px;padding-top:6px;border-top:1px solid var(--border)}
.side .focus{font-style:italic;color:var(--dim);margin-bottom:3px}
.side .row{display:flex;gap:4px;margin-bottom:2px}
.side .row b{min-width:12px;flex-shrink:0}
.side .row b.c0{color:var(--red)}.side .row b.c1{color:#b45309}.side .row b.c2{color:var(--blue)}.side .row b.c3{color:var(--green)}
.hd{text-align:center;padding:36px 32px;background:linear-gradient(135deg,#1c1917,#44403c);border-radius:12px;color:#fff;margin-bottom:14px}
.hd h1{font-size:26px;font-weight:700;margin:6px 0}.hd p{font-size:10px;opacity:.5}
.badge{display:inline-block;background:var(--accent);padding:2px 8px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:2px}
.tabs{display:flex;gap:3px;justify-content:center;margin-bottom:12px}
.tab{padding:11px 24px;border:1px solid var(--border);background:var(--card);border-radius:7px;cursor:pointer;font-size:15px;font-weight:500}
.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.s{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
.sh{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.sn{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0;background:var(--accent)}
.st{font-size:18px;font-weight:700}
.sd{color:var(--dim);font-size:14px;margin-bottom:5px;line-height:1.6}
.prompt-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px 18px;font-size:14px;margin-bottom:8px;cursor:pointer;line-height:1.5}
.prompt-box{position:relative}
.prompt-box::after{content:"\590D\5236";position:absolute;top:8px;right:10px;font-size:10px;padding:2px 8px;background:var(--accent);color:#fff;border-radius:4px;pointer-events:none}
.prompt-box.copied::after{content:"\2713";background:var(--green)}

.prompt-box:hover{border-color:var(--accent)}
.prompt-box.copied{border-color:var(--green)}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:5px}
.sp{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.sp-name{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:4px}
.sr{display:flex;align-items:center;gap:3px;margin-bottom:2px}
.sl{font-size:12px;color:var(--dim);width:80px}
.sb{display:flex;gap:1px}
.sc{width:34px;height:34px;border:1px solid var(--border);background:var(--card);color:var(--dim);border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;position:relative}
.sc:hover{border-color:var(--dim)}
.sc.a0{background:var(--rbg);border-color:var(--red);color:var(--red)}
.sc.a1{background:var(--ybg);border-color:#b45309;color:var(--yellow)}
.sc.a2{background:var(--bbg);border-color:var(--blue);color:var(--blue)}
.sc.a3{background:var(--gbg);border-color:var(--green);color:var(--green)}
.sc .tp{display:none;position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:var(--dark);border-radius:6px;padding:6px 9px;font-size:11px;color:#fff;width:180px;z-index:99;line-height:1.4;font-weight:400;white-space:normal}
.sc:hover .tp{display:block}
.extras{display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap}
.extras input{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:6px 9px;font-size:12px;flex:1;min-width:50px;color:var(--text)}
.extras input:focus{outline:none;border-color:var(--accent)}
.tm{font-family:monospace;font-size:14px;color:var(--accent);min-width:28px}
.tb{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:7px;display:flex;align-items:center;justify-content:center}
.ac{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:8px;position:relative}
.ac .rm{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:8px;display:flex;align-items:center;justify-content:center;color:var(--red)}
.ar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.ar input,.ar select{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 12px;font-size:13px}
.ar input:focus,.ar select:focus{outline:none;border-color:var(--accent)}
.cg{display:flex;gap:3px;flex-wrap:wrap;margin:3px 0}
.cg label{display:flex;align-items:center;gap:3px;font-size:12px;cursor:pointer;padding:5px 10px;border-radius:5px;border:1px solid var(--border);background:var(--card)}
.cg label:has(input:checked){background:var(--abg);border-color:var(--abr);color:var(--accent);font-weight:500}
.cg input{display:none}
.cg .x{margin-left:2px;color:var(--red);cursor:pointer;font-size:7px}
.lo{margin-top:10px;padding:10px 14px;background:var(--card);border:1px solid var(--abr);border-radius:5px;font-size:11px;display:flex;align-items:center;gap:5px;word-break:break-all;color:var(--dim)}
.lo .cp{padding:6px 14px;background:var(--accent);border:none;border-radius:4px;font-size:9px;cursor:pointer;color:#fff;white-space:nowrap}
.lbl{font-size:12px;font-weight:600;margin:5px 0 2px;color:var(--dim)}
.lbl span{color:var(--accent);cursor:pointer;margin-left:4px}.lbl .cl{color:var(--light);cursor:pointer;margin-left:3px}
.submit-bar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--border);padding:9px 12px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;border-radius:9px;box-shadow:0 -2px 6px rgba(0,0,0,.03)}
.submit-btn{background:var(--accent);color:#fff;border:none;padding:14px 36px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.submit-btn:disabled{opacity:.4}
table.dt{width:100%;border-collapse:collapse;font-size:13px;margin-top:5px}
table.dt th,table.dt td{padding:8px 10px;border:1px solid var(--border);text-align:center}
table.dt th{background:var(--bg);font-size:11px;font-weight:600;color:var(--dim)}
.refresh-btn{padding:4px 10px;background:var(--abg);border:1px solid var(--abr);border-radius:5px;font-size:9px;cursor:pointer;color:var(--accent);font-weight:500}
.toast{position:fixed;bottom:14px;right:14px;background:var(--dark);color:#fff;padding:7px 12px;border-radius:7px;font-size:12px;opacity:0;transform:translateY(10px);transition:all .3s;z-index:9999}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:900px){.w{flex-direction:column}.side{width:100%;position:static;height:auto;margin-top:10px}}

.img-zone{margin-top:6px;border:2px dashed var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s}
.img-zone:focus{border-color:var(--accent);outline:none;background:rgba(234,88,12,.03)}
.img-zone:focus .img-zone-label b{color:var(--accent)}
.img-zone.drag-over{border-color:var(--accent);background:rgba(234,88,12,.05)}
.img-zone-label{font-size:11px;color:var(--dim);margin-bottom:6px}
.img-zone-label b{color:var(--light);font-weight:600}
.img-list{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.img-thumb{position:relative;width:64px;height:64px;border-radius:5px;overflow:hidden;border:1px solid var(--border)}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-del{position:absolute;top:2px;right:2px;width:16px;height:16px;background:var(--red);color:#fff;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.img-add{width:64px;height:64px;border:2px dashed var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--light);transition:border-color .2s}
.img-add:hover{border-color:var(--accent);color:var(--accent)}

.lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:90%;max-height:90%;border-radius:8px;box-shadow:0 4px 30px rgba(0,0,0,.5)}

.extras textarea{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:6px 9px;font-size:12px;font-family:inherit;line-height:1.5;overflow:hidden;box-sizing:border-box;width:100%}

.plat-tabs{display:flex;gap:0;margin-top:10px;border-bottom:2px solid var(--border);overflow-x:auto}
.plat-tab{padding:8px 16px;font-size:13px;font-weight:600;border:none;background:none;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.plat-tab:hover{color:var(--accent)}
.plat-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.analysis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
.acard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .2s}
.acard:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(234,88,12,.1)}
.acard-title{font-size:14px;font-weight:700;margin-bottom:4px;color:var(--dark)}
.acard-preview{font-size:11px;color:var(--dim);line-height:1.5;max-height:60px;overflow:hidden}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border-radius:12px;padding:24px;max-width:90vw;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.3);width:100%}
.modal-box h2{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--dark)}
.modal-close{position:absolute;top:12px;right:16px;font-size:20px;cursor:pointer;color:var(--dim);background:none;border:none}
.heatmap td{text-align:center;padding:6px 10px;font-size:12px;font-weight:600;border-radius:4px}
.hm-0{background:#fef2f2;color:#dc2626}.hm-1{background:#fef9c3;color:#ca8a04}.hm-2{background:#ecfdf5;color:#059669}.hm-3{background:#dcfce7;color:#16a34a}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-label{width:100px;font-size:11px;font-weight:600;text-align:right;color:var(--dim)}
.bar-track{flex:1;height:18px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.bar-val{width:36px;font-size:12px;font-weight:700;color:var(--accent)}
.trend-up{color:#16a34a}.trend-down{color:#dc2626}.trend-flat{color:#78716c}
</style>
</head>
<body>
<div class="w">
<div class="main">
<div class="hd"><div class="badge">v3.0</div><h1 id="title">AI 游戏测评</h1><p id="sub"></p></div>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
</div>
<div class="side" id="side"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const REPO='tlswa-123/ai-game-eval',TK=localStorage.getItem('gh_token')||new URLSearchParams(location.search).get('token')||'';
const BASE=location.origin+location.pathname;
// ===== RUBRICS =====
const DIMS_12=[
{k:'stability',name:'功能稳定性',focus:'是否影响游戏的运行？',d:['有致命bug，无法启动（进不去/点击没反应/崩溃/报错/卡死）','能运行但核心功能有明显缺失或异常，严重影响体验（核心按钮失效/素材遮挡/被迫刷新）','核心循环可整局跑完，仅1~2个不打断主流程的小瑕疵（如首帧白屏后正常）','零Bug，反复多局测试均稳定，无任何报错/卡顿/资源缺失']},
{k:'visual',name:'视觉品质',focus:'视觉表达与反馈，是否有效',d:['核心元素缺失或无法辨认，视觉观感意义不明，难以体现游戏类型','核心元素可辨识，能看出特色，但画风/动效/排版有瑕疵不协调','素材齐全，画风统一，主题清晰，一眼看出类型，整体协调','有点睛设计或记忆点，有爽感/沉浸感/冲击感/解压感']},
{k:'audio',name:'音效品质',focus:'音效和BGM表达与反馈，是否有效',d:['音效或BGM存在基础质量问题，严重刺耳/错位/爆音；或完全无声音','至少有音效或BGM之一，但操作反馈/主题契合/音量听感有瑕疵','配乐完整，音效和BGM都有，主题契合，听感正常，但感受平平','综合听感能调动情绪——音效有层次递进、BGM有节奏切换、与玩法精确同步']},
{k:'faithfulness',name:'指令还原度',focus:'prompt有，做了没？做得好不好？',d:['几乎未实现prompt要求，严重跑题，或自作主张换核心机制','实现了大部分，但存在明显遗漏或理解偏差（更改/扭曲原始指令）','所有要求都已实现，逻辑无遗漏无偏移，逐条都能勾上','完整实现 + 加入合理额外细节扩展，加分不喧宾夺主']},
{k:'gameplay',name:'玩法设计',focus:'玩法机制是否吸引人？',d:['玩法不成立——核心机制错误、规则矛盾、死循环或无法通关','能玩，但交互/数值/难度设计失衡，或不易理解与使用','核心玩法合理，逻辑合理，数值节奏均衡，难易合理，有清晰目标','有惊喜——机制/数值/关卡至少一项出彩，吸引持续游玩，易懂好上手']},
{k:'subjective',name:'主观综合评价',focus:'想不想主动玩或主动分享？',d:['第一眼劝退，或玩了一半想关掉（第一印象）','看起来有意思，实际玩几把就无感，不会主动再打开（进一步体验）','有点上头，可以收藏下次玩，感觉是完整的游戏（主动玩）','好玩有意思！想分享出去，感觉完成度高，是成熟游戏（主动传播）']}
];
const DIMS_3=[
{k:'execution',name:'修改执行力',focus:'是否准确理解指令、改对位置、改全要求',d:['完全没改或改错位置/方向，等同于没执行。或改对了但过度联动远超要求','大方向对但有遗漏或误伤——改了一部分但漏做其他要求，或牵连破坏原有功能','按要求全部改到位，无遗漏无副作用，逐条都能验证通过','全部到位+主动处理了指令没明说但逻辑上应联动的部分']},
{k:'content_quality',name:'修改内容质量',focus:'只看本次改动部分本身的效果好不好',d:['改出来的内容不能用或严重不合理','进行了修改但效果粗糙/不协调/参数明显偏差','效果好，符合描述预期，质量不低于修改前水准','超出预期，改动部分本身有点睛效果']},
{k:'memory',name:'迭代记忆力',focus:'多轮修改后之前的改动是否保持完整',d:['每轮都丢失之前已完成的修改，等于从头来过','记得之前改动但出现部分冲突或回退','之前所有轮次的修改全部保持完整，无回退无冲突','主动发现并修复了之前轮次遗留的bug或不一致']},
{k:'subjective',name:'主观综合评价',focus:'想不想主动玩或主动分享？',d:['第一眼劝退，或玩了一半想关掉（第一印象）','看起来有意思，玩几把无感了，不会主动再打开（进一步体验）','有点上头，可以收藏下次玩，是完整的游戏（主动玩）','好玩有意思！想分享出去，完成度高，成熟游戏（主动传播）']}
];
// Short tips for hover
const SHORT_12=['致命bug/无法启动','能跑但核心异常','正常仅小瑕疵','零Bug稳定','元素缺失/意义不明','可辨识但不协调','统一清晰协调','有点睛/沉浸感','无声/刺耳/爆音','有但瑕疵','完整契合正常','调动情绪/层次','跑题/换机制','有遗漏/偏差','全部实现','完整+合理扩展','机制不成立','能玩但失衡','合理均衡','有惊喜出彩','第一眼劝退','玩几把无感','想收藏下次玩','想分享出去'];

async function ghPut(path,content){
  const tk=localStorage.getItem('gh_token')||TK;
  let sha='';
  try{const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`,{headers:{Authorization:'token '+tk}});if(r.ok)sha=(await r.json()).sha}catch(e){}
  const body={message:'submit',content:btoa(unescape(encodeURIComponent(content)))};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`,{method:'PUT',headers:{Authorization:'token '+tk,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){
    // Update manifest
    try{
      const mPath='data/manifest.json';
      const mr=await fetch(`https://api.github.com/repos/${REPO}/contents/${mPath}`,{headers:{Authorization:'token '+tk}});
      let mSha='',files=[];
      if(mr.ok){const md=await mr.json();mSha=md.sha;files=JSON.parse(decodeURIComponent(escape(atob(md.content))))}
      const fname=path.split('/').pop();
      if(!files.includes(fname))files.push(fname);
      const mBody={message:'manifest',content:btoa(unescape(encodeURIComponent(JSON.stringify(files))))};
      if(mSha)mBody.sha=mSha;
      await fetch(`https://api.github.com/repos/${REPO}/contents/${mPath}`,{method:'PUT',headers:{Authorization:'token '+tk,'Content-Type':'application/json'},body:JSON.stringify(mBody)});
    }catch(e){}
  }
  return r.ok;
}
async function ghList(d){
  // Read manifest from raw URL (no API, no rate limit, no token needed)
  try{
    const r=await fetch(`https://raw.githubusercontent.com/${REPO}/main/${d}/manifest.json?t=`+Date.now());
    if(r.ok){const files=await r.json();return files.map(name=>({name}))}
  }catch(e){}
  // Fallback to API
  const tk=localStorage.getItem('gh_token')||'';
  const h=tk?{Authorization:'token '+tk}:{};
  const r2=await fetch(`https://api.github.com/repos/${REPO}/contents/${d}`,{headers:h});
  return r2.ok?r2.json():[];
}
async function ghGet(p){
  // Use raw URL (no rate limit for public repos!)
  try{
    const encoded=p.split('/').map(s=>encodeURIComponent(s)).join('/');
    const r=await fetch(`https://raw.githubusercontent.com/${REPO}/main/${encoded}?t=`+Date.now());
    if(r.ok){const t=await r.text();return JSON.parse(t)}
  }catch(e){}
  // Fallback to API
  const tk=localStorage.getItem('gh_token')||'';
  const h=tk?{Authorization:'token '+tk}:{};
  const encoded2=p.split('/').map(s=>encodeURIComponent(s)).join('/');
  const r2=await fetch(`https://api.github.com/repos/${REPO}/contents/${encoded2}`,{headers:h});
  if(!r2.ok)return null;const d=await r2.json();return JSON.parse(decodeURIComponent(escape(atob(d.content))));
}

function scoreSingle(base,dims,shorts){
  let h='<div class="sp" style="margin-top:4px">';
  dims.forEach((dim,di)=>{
    const sk=base+'_'+dim.k;
    h+='<div class="sr"><span class="sl">'+dim.name+'</span><div class="sb">';
    for(let v=0;v<4;v++){
      const tip=shorts[di*4+v];
      h+='<button class="sc'+(scores[sk]===v?' a'+v:'')
        +'" data-k="'+sk+'" data-v="'+v+'" onclick="setS(\''+sk+'\','+v+')">'+v
        +'<span class="tp">'+v+': '+tip+'</span></button>';
    }
    h+='</div></div>';
  });
  // Subjective is now part of dims array
  // Timer + manual
  h+='<div class="extras"><input placeholder="游戏链接或ID" style="flex:1" value="'+(fields[base+'_link']||'')+'" onchange="fields[\''+base+'_link\']=this.value"></div>';
  // Note
  h+='<div class="extras"><textarea placeholder="备注" style="flex:1;min-height:26px;resize:vertical;overflow:hidden" oninput="this.style.height=\'auto\';this.style.height=this.scrollHeight+\'px\'" onchange="fields[\''+base+'_n\']=this.value">'+(fields[base+'_n']||'')+'</textarea></div>';
  // Images
  h+='<div class="img-zone" data-imgbase="'+base+'" tabindex="0" ondrop="dropImg(event,\''+base+'\')" ondragover="event.preventDefault();this.classList.add(\'drag-over\')" ondragleave="this.classList.remove(\'drag-over\')">';
  h+='<div class="img-zone-label">截图（点击+/拖入/Ctrl+V）</div><div class="img-list">';
  const imgs=fields[base+'_imgs']||[];
  imgs.forEach((src,ii)=>{h+='<div class="img-thumb"><img src="'+src+'"><div class="img-del" onclick="event.stopPropagation();rmImg(\''+base+'\','+ii+')">x</div></div>'});
  if(imgs.length<4){h+='<label class="img-add"><input type="file" accept="image/*" style="display:none" onchange="addImg(\''+base+'\',this)">+</label>';}
  h+='</div></div>';

  return h;
}

      h+='<div class="cg">'+SCENES.map(s=>'<label><input type="checkbox" '+((a.scenes||[]).includes(s.id)?'checked':'')+' onchange="togA('+i+',\'scenes\',\''+s.id+'\')">'+s.name.replace('场景','S')+'</label>').join('')+'</div>';

function addA(){assigns.push({name:'',platforms:[],scenes:SCENES.map(s=>s.id),cases:[],target:'multi'});saveA();render()}
function rmA(i){assigns.splice(i,1);saveA();render()}
function togA(i,f,v){const a=assigns[i];if(!a[f])a[f]=[];const x=a[f].indexOf(v);if(x>=0)a[f].splice(x,1);else a[f].push(v);saveA();render()}
function rmPlat(p){const i=custPlats.indexOf(p);if(i>=0){custPlats.splice(i,1);localStorage.setItem('ep3',JSON.stringify(custPlats));assigns.forEach(a=>{if(a.platforms){const x=a.platforms.indexOf(p);if(x>=0)a.platforms.splice(x,1)}});saveA();render()}}
function selAllC(i){const a=assigns[i];const list=a.target==='gdd'?GDD_CASES:DIRECT_CASES;a.cases=list.map(c=>(a.target==='gdd'?'g':'d')+c.num);saveA();render()}
function addP(i){const el=document.getElementById('np'+i);const n=el.value.trim();if(!n)return;if(!custPlats.includes(n)&&!DEF_PLATS.includes(n)){custPlats.push(n);localStorage.setItem('ep3',JSON.stringify(custPlats))}if(!assigns[i].platforms)assigns[i].platforms=[];if(!assigns[i].platforms.includes(n))assigns[i].platforms.push(n);saveA();render()}
function saveA(){localStorage.setItem('ea5',JSON.stringify(assigns))}
function mkLink(a){if(!a.name||!(a.platforms||[]).length)return'';const tk=localStorage.getItem('gh_token')||'';let url=BASE+'?token='+encodeURIComponent(tk)+'&name='+encodeURIComponent(a.name)+'&platforms='+encodeURIComponent(a.platforms.join(','))+'&target='+a.target;if(a.target==='multi')url+='&scenes='+encodeURIComponent((a.scenes||[]).join(','));else url+='&cases='+encodeURIComponent((a.cases||[]).join(','));return url+'&mode=tester'}
// ===== SUBMIT =====
async function doSubmit(){
  const nameEl=document.getElementById('nameField');if(nameEl)cfg.name=nameEl.value.trim();if(!cfg.name){toast('请输入姓名');return}
  const btn=document.getElementById('subBtn');btn.textContent='...';btn.disabled=true;
  const dims=getDims();
  const result={name:cfg.name,platforms:cfg.platforms,target:cfg.target,time:new Date().toISOString(),data:[]};
  cfg.platforms.forEach(plat=>{
    const pk=plat.replace(/[^a-zA-Z0-9]/g,'_');
    const pd={platform:plat,items:[]};
    if(cfg.target==='multi'){
      SCENES.filter(s=>cfg.scenes.includes(s.id)).forEach(scene=>{
        scene.rounds.forEach((r,ri)=>{
          const base=pk+'_'+scene.id+'_r'+(ri+1);
          const item={scene:scene.name,round:ri+1,scores:{},time:timers[base]||0,link:fields[base+'_link']||'',note:fields[base+'_n']||'',imgs:fields[base+'_imgs']||[]};
          dims.forEach(d=>{item.scores[d.k]=scores[base+'_'+d.k]});
          const v=Object.values(item.scores).filter(x=>x!==undefined);
          item.avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):'';
          pd.items.push(item);
        });
      });
    }else{
      const list=cfg.target==='gdd'?GDD_CASES.filter(c=>cfg.cases.includes('g'+c.num)):DIRECT_CASES.filter(c=>cfg.cases.includes('d'+c.num));
      list.forEach(c=>{
        const base=pk+'_'+(cfg.target==='gdd'?'g':'d')+c.num;
        const item={name:c.name,num:c.num,scores:{},time:timers[base]||0,link:fields[base+'_link']||'',note:fields[base+'_n']||'',imgs:fields[base+'_imgs']||[]};
        dims.forEach(d=>{item.scores[d.k]=scores[base+'_'+d.k]});
        const v=Object.values(item.scores).filter(x=>x!==undefined);
        item.avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):'';
        pd.items.push(item);
      });
    }
    result.data.push(pd);
  });
  const ok=await ghPut('data/'+cfg.name+'_'+Date.now()+'.json',JSON.stringify(result,null,2));
  btn.textContent=ok?'OK':'fail';if(ok)toast('已提交');else btn.disabled=false;
}

async function loadSum(){
  try{
  const files=await ghList('data');const all=[];
  const fnames=[];for(const f of files){if(!f.name.endsWith('.json')||f.name==='manifest.json')continue;const d=await ghGet('data/'+f.name);if(d){all.push(d);fnames.push(f.name)}}window._files=fnames
  if(!all.length){document.getElementById('app').innerHTML=`<div class="s"><div class="sd">${TK?"暂无提交数据":"请输入Token查看数据"}</div><div style="margin-top:8px"><input type="password" placeholder="粘贴Token" value="${TK}" style="width:100%;padding:8px;border:1px solid #e7e5e4;border-radius:6px;font-size:12px" onchange="localStorage.setItem('gh_token',this.value);location.reload()"></div></div>`;return}
  // Separate by target
  const byTarget={multi:[],gdd:[],direct:[]};
  all.forEach(d=>{if(byTarget[d.target])byTarget[d.target].push(d);else byTarget.multi.push(d)});
  let h='<div class="s"><div class="sh"><div class="sn" style="background:var(--green)">'+all.length+'</div><div class="st">'+all.length+' 份提交</div><button class="refresh-btn" onclick="loadSum()" style="margin-left:auto">刷新</button></div></div>';
  
  // For each target that has data, render analysis
  if(byTarget.gdd.length) h+=renderTargetAnalysis('① GDD复刻',byTarget.gdd,DIMS_12);
  if(byTarget.direct.length) h+=renderTargetAnalysis('② 直接需求',byTarget.direct,DIMS_12);
  if(byTarget.multi.length) h+=renderTargetAnalysis('③ 多轮修改',byTarget.multi,DIMS_3);
  
  h+='<div id="submitList"></div>';
  h+='<div class="s" style="display:flex;gap:10px"><button class="tab active" style="border:none" onclick="expExcel()">📊 导出Excel</button><button class="tab" style="border:none" onclick="expHtml()">📄 导出HTML报告(含图片)</button></div>';
  document.getElementById('app').innerHTML=h;window._d=all;
  // Render expandable list
  setTimeout(()=>{
    let sl='';
    all.forEach((d,di)=>{
      const fileName=window._files?window._files[di]:'';
      sl+='<div style="border:1px solid var(--border);border-radius:6px;margin-bottom:6px;overflow:hidden">';
      sl+='<div style="display:flex;align-items:center;padding:8px 12px;cursor:pointer;background:var(--bg)" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\'">';
      sl+='<b style="flex:1">'+d.name+'</b>';
      sl+='<span style="color:var(--dim);font-size:11px;margin-right:8px">'+(d.platforms||[d.platform||'']).join(', ')+'</span>';
      sl+='<span style="font-size:10px;color:var(--light)">'+new Date(d.time).toLocaleString('zh-CN')+'</span>';
      sl+='</div>';
      sl+='<div style="display:none;padding:8px 12px;border-top:1px solid var(--border);font-size:12px">';
      (d.data||[]).forEach(pd=>{
        sl+='<div style="margin-bottom:4px"><b>'+pd.platform+'</b>: ';
        const avgs=(pd.items||[]).map(i=>parseFloat(i.avg)).filter(v=>!isNaN(v));
        const avg=avgs.length?(avgs.reduce((a,b)=>a+b,0)/avgs.length).toFixed(2):'-';
        sl+='均分 <span style="color:var(--accent);font-weight:700">'+avg+'</span></div>';
      });
      sl+='<div style="display:flex;gap:8px;margin-top:6px">';
      sl+='<button style="padding:4px 12px;background:var(--accent);color:#fff;border:none;border-radius:4px;font-size:11px;cursor:pointer" onclick="viewSubmit('+di+')">查看详情</button>';
      sl+='<button style="padding:4px 12px;background:var(--bg);color:var(--red);border:1px solid var(--red);border-radius:4px;font-size:11px;cursor:pointer" onclick="delSubmit(\''+fileName+'\','+di+')">删除</button>';

}catch(e){document.getElementById('app').innerHTML='<div class="s"><div class="sd" style="color:var(--red)">加载错误: '+e.message+'</div></div>';console.error(e)}
}
function renderTargetAnalysis(title,data,dims){
  const platStats={};
  data.forEach(d=>{(d.data||[]).forEach(pd=>{
    if(!platStats[pd.platform])platStats[pd.platform]={dimSums:{},dimCounts:{},totalScores:[],totalTime:0,items:[]};
    const ps=platStats[pd.platform];
    dims.forEach(dim=>{if(!ps.dimSums[dim.k]){ps.dimSums[dim.k]=0;ps.dimCounts[dim.k]=0}});
    (pd.items||[]).forEach(item=>{
      let it=0,ic=0;
      dims.forEach(dim=>{const v=(item.scores||{})[dim.k];if(v!==undefined&&v!==null){ps.dimSums[dim.k]+=v;ps.dimCounts[dim.k]++;it+=v;ic++}});
      if(ic)ps.totalScores.push(it/ic);
      ps.totalTime+=(item.time||0);
      ps.items.push({...item,platform:pd.platform});
    });
  })});
  const platforms=Object.keys(platStats);
  if(!platforms.length)return'';
  const avg=arr=>arr.length?(arr.reduce((a,b)=>a+b,0)/arr.length):0;
  const fmtA=v=>typeof v==='number'?v.toFixed(2):'-';
  
  // Store analysis data globally for modal access
  const aid='a_'+title.replace(/[^a-z0-9]/gi,'');
  window[aid]={platStats,platforms,dims,title,data};

  let h='<div class="s"><div class="sh"><div class="sn" style="background:var(--blue)">'+title[0]+'</div><div class="st">'+title+'</div></div>';
  h+='<div class="analysis-grid">';
  
  // Card 1: Platform Ranking
  const sorted=platforms.map(p=>({p,s:avg(platStats[p].totalScores)})).sort((a,b)=>b.s-a.s);
  h+='<div class="acard" onclick="showAnalysis(\''+aid+'\',\'rank\')"><div class="acard-title">📊 平台综合排名</div><div class="acard-preview">'+sorted.slice(0,3).map((x,i)=>(i+1)+'. '+x.p+' '+fmtA(x.s)).join('<br>')+'</div></div>';
  
  // Card 2: Dimension Heatmap
  h+='<div class="acard" onclick="showAnalysis(\''+aid+'\',\'heatmap\')"><div class="acard-title">🎨 维度强弱热力图</div><div class="acard-preview">各平台各维度得分着色对比，快速定位强项和短板</div></div>';
  
  // Card 3: Scene×Platform Matrix (multi only)
  if(title.includes('多轮')){
    h+='<div class="acard" onclick="showAnalysis(\''+aid+'\',\'matrix\')"><div class="acard-title">📋 场景×平台矩阵</div><div class="acard-preview">每个场景每个平台的均分对比，找出擅长/不擅长的场景类型</div></div>';
    h+='<div class="acard" onclick="showAnalysis(\''+aid+'\',\'trend\')"><div class="acard-title">📈 多轮趋势分析</div><div class="acard-preview">3轮修改中分数变化趋势：越改越好还是越改越差？</div></div>';
  }
  
  // Card 5: Best/Worst
  h+='<div class="acard" onclick="showAnalysis(\''+aid+'\',\'bestworst\')"><div class="acard-title">🏆 单项最优/最差</div><div class="acard-preview">各维度冠军和短板一览</div></div>';
  
  h+='</div></div>';
  return h;
}

function showAnalysis(aid,type){
  const d=window[aid];if(!d)return;
  const{platStats,platforms,dims,title}=d;
  const avg=arr=>arr.length?(arr.reduce((a,b)=>a+b,0)/arr.length):0;
  const fmtA=v=>typeof v==='number'?v.toFixed(2):'-';
  let h='<h2>'+title+' - ';
  
  if(type==='rank'){
    h+='平台综合排名</h2>';
    const sorted=platforms.map(p=>({p,s:avg(platStats[p].totalScores),t:platStats[p].totalTime})).sort((a,b)=>b.s-a.s);
    h+='<table class="dt"><tr><th>排名</th><th>平台</th><th>综合均分</th><th>总耗时</th><th>评测项数</th></tr>';
    sorted.forEach((x,i)=>{
      const isTop=i===0,isLast=i===sorted.length-1&&sorted.length>1;
      h+='<tr><td>'+(i+1)+'</td><td><b>'+x.p+'</b></td><td style="font-weight:700;color:'+(isTop?'var(--green)':isLast?'var(--red)':'var(--accent)')+'">'+fmtA(x.s)+'</td><td>'+Math.round(x.t/60)+'min</td><td>'+platStats[x.p].totalScores.length+'</td></tr>';
    });
    h+='</table>';
    // Bar chart
    const maxS=Math.max(...sorted.map(x=>x.s));
    h+='<div style="margin-top:16px">';
    sorted.forEach((x,i)=>{
      const pct=maxS>0?Math.round(x.s/3*100):0;
      const color=i===0?'#16a34a':i===sorted.length-1&&sorted.length>1?'#dc2626':'var(--accent)';
      h+='<div class="bar-row"><span class="bar-label">'+x.p+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div><span class="bar-val" style="color:'+color+'">'+fmtA(x.s)+'</span></div>';
    });
    h+='</div>';
  }
  else if(type==='heatmap'){
    h+='维度强弱热力图</h2>';
    h+='<div style="overflow-x:auto"><table class="dt heatmap"><tr><th>平台</th>';
    dims.forEach(dim=>{h+='<th>'+dim.name+'</th>'});
    h+='</tr>';
    platforms.forEach(p=>{
      const ps=platStats[p];
      h+='<tr><td><b>'+p+'</b></td>';
      dims.forEach(dim=>{
        const val=ps.dimCounts[dim.k]?ps.dimSums[dim.k]/ps.dimCounts[dim.k]:0;
        const level=val>=2.5?3:val>=1.5?2:val>=0.5?1:0;
        h+='<td class="hm-'+level+'">'+val.toFixed(1)+'</td>';
      });
      h+='</tr>';
    });
    h+='</table></div>';
    h+='<div style="margin-top:8px;font-size:10px;color:var(--dim)">着色：<span class="hm-3" style="padding:2px 6px;border-radius:3px">≥2.5 优秀</span> <span class="hm-2" style="padding:2px 6px;border-radius:3px">≥1.5 合格</span> <span class="hm-1" style="padding:2px 6px;border-radius:3px">≥0.5 较弱</span> <span class="hm-0" style="padding:2px 6px;border-radius:3px"><0.5 差</span></div>';
  }
  else if(type==='matrix'){
    h+='场景×平台矩阵</h2>';
    // Group items by scene
    const scenes={};
    platforms.forEach(p=>{platStats[p].items.forEach(item=>{if(item.scene){if(!scenes[item.scene])scenes[item.scene]={};if(!scenes[item.scene][p])scenes[item.scene][p]=[];scenes[item.scene][p].push(parseFloat(item.avg)||0)}})});
    h+='<div style="overflow-x:auto"><table class="dt heatmap"><tr><th>场景</th>';
    platforms.forEach(p=>{h+='<th>'+p+'</th>'});
    h+='</tr>';
    Object.keys(scenes).forEach(s=>{
      h+='<tr><td><b>'+s+'</b></td>';
      platforms.forEach(p=>{
        const vals=scenes[s][p]||[];
        const val=vals.length?avg(vals):0;
        const level=val>=2.5?3:val>=1.5?2:val>=0.5?1:0;
        h+='<td class="hm-'+level+'">'+val.toFixed(1)+'</td>';
      });
      h+='</tr>';
    });
    h+='</table></div>';
  }
  else if(type==='trend'){
    h+='多轮趋势分析</h2>';
    h+='<p style="font-size:12px;color:var(--dim);margin-bottom:16px">每个场景3轮的分数变化折线图，反映迭代稳定性</p>';
    const colors=['#ea580c','#6366f1','#16a34a','#dc2626','#8b5cf6','#0891b2','#d97706'];
    const trends={};
    platforms.forEach(p=>{platStats[p].items.forEach(item=>{if(item.scene&&item.round){const k=item.scene;if(!trends[k])trends[k]={};if(!trends[k][p])trends[k][p]={};trends[k][p][item.round]=parseFloat(item.avg)||0}})});
    Object.keys(trends).forEach(scene=>{
      h+='<div style="margin-bottom:24px;background:var(--bg);border-radius:10px;padding:16px">';
      h+='<div style="font-size:14px;font-weight:700;margin-bottom:12px">'+scene+'</div>';
      // SVG line chart
      const W=500,H=180,padL=40,padR=20,padT=20,padB=30;
      const chartW=W-padL-padR,chartH=H-padT-padB;
      h+='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:600px;height:auto">';
      // Grid lines & Y axis
      for(let i=0;i<=3;i++){
        const y=padT+chartH-i/3*chartH;
        h+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#e7e5e4" stroke-width="1"/>';
        h+='<text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#78716c">'+i+'</text>';
      }
      // X axis labels
      for(let i=0;i<3;i++){
        const x=padL+i/(2)*chartW;
        h+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="#44403c" font-weight="600">轮'+(i+1)+'</text>';
      }
      // Lines for each platform
      const platList=platforms.filter(p=>trends[scene][p]);
      platList.forEach((p,pi)=>{
        const rounds=trends[scene][p];
        const r1=rounds[1]||0,r2=rounds[2]||0,r3=rounds[3]||0;
        const color=colors[pi%colors.length];
        const pts=[[r1,0],[r2,1],[r3,2]];
        const points=pts.map(([v,i])=>{
          const x=padL+i/2*chartW;
          const y=padT+chartH-v/3*chartH;
          return x+','+y;
        });
        // Line
        h+='<polyline points="'+points.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
        // Dots with values
        pts.forEach(([v,i])=>{
          const x=padL+i/2*chartW;
          const y=padT+chartH-v/3*chartH;
          h+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+color+'"/>';
          h+='<text x="'+x+'" y="'+(y-8)+'" text-anchor="middle" font-size="9" fill="'+color+'" font-weight="700">'+v.toFixed(1)+'</text>';
        });
      });
      h+='</svg>';
      // Legend
      h+='<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">';
      platList.forEach((p,pi)=>{
        const color=colors[pi%colors.length];
        const rounds=trends[scene][p]||{};
        const r1=rounds[1]||0,r3=rounds[3]||0;
        const arrow=r3>r1+0.3?'↑':r3<r1-0.3?'↓':'→';
        const tcolor=r3>r1+0.3?'#16a34a':r3<r1-0.3?'#dc2626':'#78716c';
        h+='<span style="display:flex;align-items:center;gap:4px;font-size:11px"><span style="width:12px;height:3px;background:'+color+';border-radius:2px"></span><b>'+p+'</b><span style="color:'+tcolor+';font-weight:700">'+arrow+'</span></span>';
      });
      h+='</div></div>';
    });
  }
  
  else if(type==='bestworst'){
    h+='单项最优/最差</h2>';
    h+='<table class="dt"><tr><th>维度</th><th>🏆 最佳</th><th>分数</th><th>⚠️ 最差</th><th>分数</th></tr>';
    dims.forEach(dim=>{
      let best={p:'',v:-1},worst={p:'',v:4};
      platforms.forEach(p=>{
        const ps=platStats[p];
        const val=ps.dimCounts[dim.k]?ps.dimSums[dim.k]/ps.dimCounts[dim.k]:0;
        if(val>best.v){best={p,v:val}}
        if(val<worst.v){worst={p,v:val}}
      });
      h+='<tr><td><b>'+dim.name+'</b></td><td style="color:var(--green)">'+best.p+'</td><td style="color:var(--green);font-weight:700">'+fmtA(best.v)+'</td><td style="color:var(--red)">'+worst.p+'</td><td style="color:var(--red);font-weight:700">'+fmtA(worst.v)+'</td></tr>';
    });
    // Add overall + time
    let bestT={p:'',v:-1},worstT={p:'',v:4},fastP={p:'',v:Infinity},slowP={p:'',v:0};
    platforms.forEach(p=>{
      const s=avg(platStats[p].totalScores);const t=platStats[p].totalTime;
      if(s>bestT.v)bestT={p,v:s};if(s<worstT.v)worstT={p,v:s};
      if(t<fastP.v&&t>0)fastP={p,v:t};if(t>slowP.v)slowP={p,v:t};
    });
    h+='<tr><td><b>综合均分</b></td><td style="color:var(--green)">'+bestT.p+'</td><td style="color:var(--green);font-weight:700">'+fmtA(bestT.v)+'</td><td style="color:var(--red)">'+worstT.p+'</td><td style="color:var(--red);font-weight:700">'+fmtA(worstT.v)+'</td></tr>';
    h+='<tr><td><b>效率（耗时最短）</b></td><td style="color:var(--green)">'+fastP.p+'</td><td style="color:var(--green);font-weight:700">'+Math.round(fastP.v/60)+'min</td><td style="color:var(--red)">'+slowP.p+'</td><td style="color:var(--red);font-weight:700">'+Math.round(slowP.v/60)+'min</td></tr>';
    h+='</table>';
  }
  
  document.getElementById('aModalContent').innerHTML=h;
  document.getElementById('aModal').classList.add('show');
}

function getMyData(){
  const dims=getDims();
  const result={name:cfg.name,platforms:cfg.platforms,target:cfg.target,time:new Date().toISOString(),data:[]};
  cfg.platforms.forEach(plat=>{
    const pk=plat.replace(/[^a-zA-Z0-9]/g,'_');
    const pd={platform:plat,items:[]};
    if(cfg.target==='multi'){
      SCENES.filter(s=>cfg.scenes.includes(s.id)).forEach(scene=>{
        scene.rounds.forEach((r,ri)=>{
          const base=pk+'_'+scene.id+'_r'+(ri+1);
          const item={scene:scene.name,round:ri+1,scores:{},time:timers[base]||0,link:fields[base+'_link']||'',note:fields[base+'_n']||'',imgs:fields[base+'_imgs']||[]};
          dims.forEach(d=>{item.scores[d.k]=scores[base+'_'+d.k]});
          const v=Object.values(item.scores).filter(x=>x!==undefined);
          item.avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):'';
          pd.items.push(item);
        });
      });
    }else{
      const list=cfg.target==='gdd'?GDD_CASES.filter(cc=>cfg.cases.includes('g'+cc.num)):DIRECT_CASES.filter(cc=>cfg.cases.includes('d'+cc.num));
      list.forEach(cc=>{
        const base=pk+'_'+(cfg.target==='gdd'?'g':'d')+cc.num;
        const item={name:cc.name,num:cc.num,scores:{},time:timers[base]||0,link:fields[base+'_link']||'',note:fields[base+'_n']||'',imgs:fields[base+'_imgs']||[]};
        dims.forEach(d=>{item.scores[d.k]=scores[base+'_'+d.k]});
        const v=Object.values(item.scores).filter(x=>x!==undefined);
        item.avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):'';
        pd.items.push(item);
      });
    }
    result.data.push(pd);
  });
  return result;
}

function getMyData(){
  const dims=getDims();
  const result={name:cfg.name,platforms:cfg.platforms,target:cfg.target,time:new Date().toISOString(),data:[]};
  cfg.platforms.forEach(plat=>{
    const pk=plat.replace(/[^a-zA-Z0-9]/g,'_');
    const pd={platform:plat,items:[]};
    if(cfg.target==='multi'){
      SCENES.filter(s=>cfg.scenes.includes(s.id)).forEach(scene=>{
        scene.rounds.forEach((r,ri)=>{
          const base=pk+'_'+scene.id+'_r'+(ri+1);
          const item={scene:scene.name,round:ri+1,scores:{},time:timers[base]||0,link:fields[base+'_link']||'',note:fields[base+'_n']||'',imgs:fields[base+'_imgs']||[]};
          dims.forEach(d=>{item.scores[d.k]=scores[base+'_'+d.k]});
          const v=Object.values(item.scores).filter(x=>x!==undefined);
          item.avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):'';
          pd.items.push(item);
        });
      });
    }else{
      const list=cfg.target==='gdd'?GDD_CASES.filter(cc=>cfg.cases.includes('g'+cc.num)):DIRECT_CASES.filter(cc=>cfg.cases.includes('d'+cc.num));
      list.forEach(cc=>{
        const base=pk+'_'+(cfg.target==='gdd'?'g':'d')+cc.num;
        const item={name:cc.name,num:cc.num,scores:{},time:timers[base]||0,link:fields[base+'_link']||'',note:fields[base+'_n']||'',imgs:fields[base+'_imgs']||[]};
        dims.forEach(d=>{item.scores[d.k]=scores[base+'_'+d.k]});
        const v=Object.values(item.scores).filter(x=>x!==undefined);
        item.avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):'';
        pd.items.push(item);
      });
    }
    result.data.push(pd);
  });
  return result;
}

function addImg(base,input){const file=input.files[0];if(file)readImg(base,file)}
function readImg(base,file){if(!file||!file.type.startsWith('image'))return;const reader=new FileReader();reader.onload=e=>{if(!fields[base+'_imgs'])fields[base+'_imgs']=[];if(fields[base+'_imgs'].length>=4){toast('最多4张');return}fields[base+'_imgs'].push(e.target.result);updateImgZone(base)};reader.readAsDataURL(file)}
function updateImgZone(base){
  const zone=document.querySelector('[data-imgbase="'+base+'"] .img-list');
  if(!zone){render();return}
  const imgs=fields[base+'_imgs']||[];
  let h='';
  imgs.forEach((src,ii)=>{h+='<div class="img-thumb"><img src="'+src+'"><div class="img-del" onclick="event.stopPropagation();rmImg(\''+base+'\','+ii+')">x</div></div>'});
  if(imgs.length<4){h+='<label class="img-add"><input type="file" accept="image/*" style="display:none" onchange="addImg(\''+base+'\',this)">+</label>';}
  zone.innerHTML=h;
}
function dropImg(e,base){e.preventDefault();e.stopPropagation();const file=e.dataTransfer.files[0];if(file)readImg(base,file)}
function rmImg(base,idx){if(fields[base+'_imgs'])fields[base+'_imgs'].splice(idx,1);updateImgZone(base)}
