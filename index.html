
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI游戏测评</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafaf9;--card:#fff;--border:#e7e5e4;--text:#1c1917;--dim:#78716c;--light:#a8a29e;--accent:#ea580c;--abg:#fff7ed;--abr:#fed7aa;--dark:#1c1917;--green:#166534;--gbg:#dcfce7;--yellow:#92400e;--ybg:#fef3c7;--red:#dc2626;--rbg:#fef2f2;--blue:#1e40af;--bbg:#dbeafe}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;padding:32px 40px}
.w{max-width:100%;margin:0 auto;display:flex;gap:0}
.main{flex:1;min-width:0;max-width:100%;padding-right:14px}
.side{width:380px;flex-shrink:0;position:sticky;top:12px;height:calc(100vh - 24px);overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;line-height:1.7}
.side::-webkit-scrollbar{width:3px}.side::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.side h3{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:8px}
.side h4{font-size:14px;font-weight:600;margin:8px 0 3px;padding-top:6px;border-top:1px solid var(--border)}
.side .focus{font-style:italic;color:var(--dim);margin-bottom:3px}
.side .row{display:flex;gap:4px;margin-bottom:2px}
.side .row b{min-width:12px;flex-shrink:0}
.side .row b.c0{color:var(--red)}.side .row b.c1{color:#b45309}.side .row b.c2{color:var(--blue)}.side .row b.c3{color:var(--green)}
.hd{text-align:center;padding:36px 32px;background:linear-gradient(135deg,#1c1917,#44403c);border-radius:12px;color:#fff;margin-bottom:14px}
.hd h1{font-size:26px;font-weight:700;margin:6px 0}.hd p{font-size:10px;opacity:.5}
.badge{display:inline-block;background:var(--accent);padding:2px 8px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:2px}
.tabs{display:flex;gap:3px;justify-content:center;margin-bottom:12px}
.tab{padding:11px 24px;border:1px solid var(--border);background:var(--card);border-radius:7px;cursor:pointer;font-size:15px;font-weight:500}
.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.s{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
.sh{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.sn{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0;background:var(--accent)}
.st{font-size:18px;font-weight:700}
.sd{color:var(--dim);font-size:14px;margin-bottom:5px;line-height:1.6}
.prompt-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px 18px;font-size:14px;margin-bottom:8px;cursor:pointer;line-height:1.5;position:relative;white-space:pre-wrap;word-break:break-word}
.prompt-box::after{content:"\590D\5236";position:absolute;top:8px;right:10px;font-size:10px;padding:2px 8px;background:var(--accent);color:#fff;border-radius:4px;pointer-events:none}
.prompt-box.copied::after{content:"\2713";background:var(--green)}
.prompt-box:hover{border-color:var(--accent)}
.prompt-box.copied{border-color:var(--green)}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:5px}
.sp{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.sp-name{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:4px}
.sr{display:flex;align-items:center;gap:3px;margin-bottom:2px}
.sl{font-size:12px;color:var(--dim);width:80px}
.sb{display:flex;gap:1px}
.sc{width:34px;height:34px;border:1px solid var(--border);background:var(--card);color:var(--dim);border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;position:relative}
.sc:hover{border-color:var(--dim)}
.sc.a0{background:var(--rbg);border-color:var(--red);color:var(--red)}
.sc.a1{background:var(--ybg);border-color:#b45309;color:var(--yellow)}
.sc.a2{background:var(--bbg);border-color:var(--blue);color:var(--blue)}
.sc.a3{background:var(--gbg);border-color:var(--green);color:var(--green)}
.sc .tp{display:none;position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:var(--dark);border-radius:6px;padding:6px 9px;font-size:11px;color:#fff;width:180px;z-index:99;line-height:1.4;font-weight:400;white-space:normal}
.sc:hover .tp{display:block}
.extras{display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap}
.extras input{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:6px 9px;font-size:12px;flex:1;min-width:50px;color:var(--text)}
.extras input:focus{outline:none;border-color:var(--accent)}
.extras textarea{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:6px 9px;font-size:12px;font-family:inherit;line-height:1.5;overflow:hidden;box-sizing:border-box;width:100%}
.ac{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:8px;position:relative}
.ac .rm{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:8px;display:flex;align-items:center;justify-content:center;color:var(--red)}
.ar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.ar input,.ar select{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 12px;font-size:13px}
.ar input:focus,.ar select:focus{outline:none;border-color:var(--accent)}
.cg{display:flex;gap:3px;flex-wrap:wrap;margin:3px 0}
.cg label{display:flex;align-items:center;gap:3px;font-size:12px;cursor:pointer;padding:5px 10px;border-radius:5px;border:1px solid var(--border);background:var(--card)}
.cg label:has(input:checked){background:var(--abg);border-color:var(--abr);color:var(--accent);font-weight:500}
.cg input{display:none}
.cg .x{margin-left:2px;color:var(--red);cursor:pointer;font-size:7px}
.lo{margin-top:10px;padding:10px 14px;background:var(--card);border:1px solid var(--abr);border-radius:5px;font-size:11px;display:flex;align-items:center;gap:5px;word-break:break-all;color:var(--dim)}
.lo .cp{padding:6px 14px;background:var(--accent);border:none;border-radius:4px;font-size:9px;cursor:pointer;color:#fff;white-space:nowrap}
.lbl{font-size:12px;font-weight:600;margin:5px 0 2px;color:var(--dim)}
.lbl span{color:var(--accent);cursor:pointer;margin-left:4px}.lbl .cl{color:var(--light);cursor:pointer;margin-left:3px}
.submit-bar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--border);padding:9px 12px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;border-radius:9px;box-shadow:0 -2px 6px rgba(0,0,0,.03)}
.submit-btn{background:var(--accent);color:#fff;border:none;padding:14px 36px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.submit-btn:disabled{opacity:.4}
table.dt{width:100%;border-collapse:collapse;font-size:13px;margin-top:5px}
table.dt th,table.dt td{padding:8px 10px;border:1px solid var(--border);text-align:center}
table.dt th{background:var(--bg);font-size:11px;font-weight:600;color:var(--dim)}
.refresh-btn{padding:4px 10px;background:var(--abg);border:1px solid var(--abr);border-radius:5px;font-size:9px;cursor:pointer;color:var(--accent);font-weight:500}
.toast{position:fixed;bottom:14px;right:14px;background:var(--dark);color:#fff;padding:7px 12px;border-radius:7px;font-size:12px;opacity:0;transform:translateY(10px);transition:all .3s;z-index:9999}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:900px){.w{flex-direction:column}.side{width:100%;position:static;height:auto;margin-top:10px}}
.img-zone{margin-top:6px;border:2px dashed var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s}
.img-zone:focus{border-color:var(--accent);outline:none;background:rgba(234,88,12,.03)}
.img-zone.drag-over{border-color:var(--accent);background:rgba(234,88,12,.05)}
.img-zone-label{font-size:11px;color:var(--dim);margin-bottom:6px}
.img-list{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.img-thumb{position:relative;width:64px;height:64px;border-radius:5px;overflow:hidden;border:1px solid var(--border)}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-del{position:absolute;top:2px;right:2px;width:16px;height:16px;background:var(--red);color:#fff;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.img-add{width:64px;height:64px;border:2px dashed var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--light);transition:border-color .2s}
.img-add:hover{border-color:var(--accent);color:var(--accent)}
.lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:90%;max-height:90%;border-radius:8px;box-shadow:0 4px 30px rgba(0,0,0,.5)}
.plat-tabs{display:flex;gap:0;margin-top:10px;border-bottom:2px solid var(--border);overflow-x:auto}
.plat-tab{padding:8px 16px;font-size:13px;font-weight:600;border:none;background:none;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.plat-tab:hover{color:var(--accent)}
.plat-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.analysis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
.acard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .2s}
.acard:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(234,88,12,.1)}
.acard-title{font-size:14px;font-weight:700;margin-bottom:4px;color:var(--dark)}
.acard-preview{font-size:11px;color:var(--dim);line-height:1.5;max-height:60px;overflow:hidden}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border-radius:12px;padding:24px;max-width:90vw;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.3);width:100%}
.modal-box h2{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--dark)}
.modal-close{position:absolute;top:12px;right:16px;font-size:20px;cursor:pointer;color:var(--dim);background:none;border:none}
.heatmap td{text-align:center;padding:6px 10px;font-size:12px;font-weight:600;border-radius:4px}
.hm-0{background:#fef2f2;color:#dc2626}.hm-1{background:#fef9c3;color:#ca8a04}.hm-2{background:#ecfdf5;color:#059669}.hm-3{background:#dcfce7;color:#16a34a}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-label{width:120px;font-size:11px;font-weight:600;text-align:right;color:var(--dim)}
.bar-track{flex:1;height:18px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.bar-val{width:36px;font-size:12px;font-weight:700;color:var(--accent)}
</style>
</head>
<body>
<div class="w">
<div class="main">
<div class="hd"><div class="badge">v4.0</div><h1 id="title">AI 游戏测评</h1><p id="sub">工蜂版</p></div>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
</div>
<div class="side" id="side"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const WOA_PROJ=1789102,WOA_API='https://git.woa.com/api/v3',WOA_REPO='arieljin/test-tool';
const TK=localStorage.getItem('woa_token')||new URLSearchParams(location.search).get('token')||'';
const BASE=location.origin+location.pathname;
// ===== RUBRICS =====
const DIMS_12=[
{k:'stability',name:'功能稳定性',focus:'是否影响游戏的运行？',d:['致命bug无法启动/崩溃/卡死/点击没反应','能运行但核心功能有明显缺失或异常','核心循环可整局跑完，仅1~2个小瑕疵','零Bug，反复多局测试均稳定']},
{k:'visual',name:'视觉品质',focus:'视觉表达与反馈是否有效',d:['核心元素缺失或无法辨认','核心可辨识但画风/动效有瑕疵不协调','素材齐全画风统一主题清晰协调','有点睛设计或记忆点，有爽感/沉浸感']},
{k:'audio',name:'音效品质',focus:'音效和BGM的表达与反馈是否有效',d:['刺耳/错位/爆音或完全无音效BGM','至少有一种但反馈/听感有瑕疵','配乐完整主题契合听感正常','能调动情绪有层次递进节奏切换']},
{k:'faithfulness',name:'指令还原度',focus:'是否完整、忠实地实现了prompt要求',d:['几乎未实现prompt要求，严重跑题','实现了部分核心要求，但有较多遗漏或偏差','大部分要求已实现，仅有少量遗漏或细节偏差','所有要求都已实现，无遗漏无偏移']},
{k:'gameplay',name:'玩法设计',focus:'整体玩法机制合理性如何？（与指令还原度冲突时，玩法不扣分，扣还原度）',d:['玩法不成立——核心机制错误/规则矛盾/死循环/无法通关','能玩但交互/数值/难度失衡，或丰富了但不易理解使用','玩法逻辑合理，数值节奏均衡，难易程度合理','玩法有惊喜——机制/数值/关卡至少一项明显出彩，吸引人持续玩']},
{k:'subjective',name:'主观综合',focus:'主观上的感受如何？',d:['第一眼劝退，或打开试玩一下马上想关掉','能玩两三下，但整体感觉很粗糙不会主动再打开','能玩五分钟，综合质感贴近小游戏单关卡水平','小超预期，整体制作完成度较高，有接近成熟游戏的感觉']}
];
const DIMS_3=[
{k:'understanding',name:'需求理解力',focus:'改没改？改多还是改少？',d:['完全没改或答非所问','大方向对但遗漏或多改了','准确理解要改什么不多不少','精确理解且考虑到关联影响']},
{k:'quality',name:'修改内容质量',focus:'改的好还是坏？',d:['改崩了比修改前更差','勉强改了但质量下降','正确修改质量持平或提升','明显变好整体质量提升']},
{k:'subjective',name:'主观综合',focus:'修改满意度',d:['完全不满意','不太满意有明显不足','基本满意达到预期','超出预期非常满意']}
];
const SHORT_12=['致命bug/无法启动','能跑但核心异常','正常仅小瑕疵','零Bug稳定','元素缺失/意义不明','可辨识但不协调','统一清晰协调','有点睛/沉浸感','无声/刺耳/爆音','有但瑕疵','完整契合正常','调动情绪/层次','严重跑题','部分实现有遗漏','大部分实现少遗漏','全部实现无偏移','机制错误/死循环','交互/数值失衡','合理均衡','有惊喜出彩','第一眼劝退','粗糙不会再打开','贴近小游戏水平','接近成熟游戏'];
const SHORT_3=['没改/答非所问','有遗漏或多改','准确不多不少','精确+关联影响','改崩了更差','勉强但质量降','正确持平提升','明显变好','完全不满意','不太满意','基本满意','超出预期'];
// ===== CASES =====
const GDD_CASES=[
{num:1,name:'挪一挪大师',diff:'简单',cat:'2D_方向逃离_动物',style:'Low-Poly几何农场',gdd:'gdd/1_挪一挪大师.md',prompt:'做一个动物逃离解谜游戏。12x18格棋盘（黄绿交替方格背景），散布多只Q版动物（每只占2x2格），每只有固定朝向（上/下/左/右，白色三角标记）。玩家点击一只动物，它沿朝向直线冲刺：前方无阻挡则冲出棋盘边缘完成逃离消除；撞到其他动物或障碍则立即停止。同一时刻只能有一只动物在移动。消除后空位保留不下落。倒计时限制（<10s变红），全部目标动物逃离即通关。有红色障碍块（带数字表示可被撞击次数）。画风Low-Poly几何农场，无描边纯填色，粉色圆润小猪造型，马卡龙配色明快。3个道具按钮（底部圆形金色）+ 暂停按钮左上角。点击动物有弹性"嘭"音效，逃离成功有欢快短音，撞停有闷响'},

async function woaPut(path,content){
  const tk=localStorage.getItem('woa_token')||TK;
  if(!tk){console.error('woaPut: no token');return false}
  const hdr={'PRIVATE-TOKEN':tk,'Content-Type':'application/json'};
  // POST to create, fall back to PUT if file exists (409)
  const body={branch_name:'master',content,commit_message:'submit'};
  let r=await fetch(`${WOA_API}/projects/${WOA_PROJ}/repository/files?file_path=${encodeURIComponent(path)}&ref=master`,{method:'POST',headers:hdr,body:JSON.stringify(body)});
  if(!r.ok&&r.status===409){r=await fetch(`${WOA_API}/projects/${WOA_PROJ}/repository/files?file_path=${encodeURIComponent(path)}&ref=master`,{method:'PUT',headers:hdr,body:JSON.stringify(body)})}
  if(!r.ok){const txt=await r.text();console.error('woaPut fail:',r.status,txt);return false}
  try{
    const mPath='data/manifest.json';let mExists=false,mFiles=[];
    try{const mr=await fetch(`${WOA_API}/projects/${WOA_PROJ}/repository/files?file_path=${encodeURIComponent(mPath)}&ref=master`,{headers:{'PRIVATE-TOKEN':tk}});if(mr.ok){mExists=true;const md=await mr.json();if(md.content){const raw=atob(md.content);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);mFiles=JSON.parse(new TextDecoder('utf-8').decode(bytes))}}}catch(e){}
    const fname=path.split('/').pop();if(!mFiles.includes(fname))mFiles.push(fname);
    const mBody={branch_name:'master',content:JSON.stringify(mFiles),commit_message:'manifest'};
    const mUrl=`${WOA_API}/projects/${WOA_PROJ}/repository/files?file_path=${encodeURIComponent(mPath)}&ref=master`;
    const mMethod=mExists?'PUT':'POST';
    await fetch(mUrl,{method:mMethod,headers:hdr,body:JSON.stringify(mBody)});
  }catch(e){console.error('manifest update fail:',e)}
  return true;
}
async function woaList(d){
  const tk=localStorage.getItem('woa_token')||TK;
  const hdr=tk?{'PRIVATE-TOKEN':tk}:{};

    // Primary: list tree (most reliable, always reflects actual repo state)
    const r=await fetch(`${WOA_API}/projects/${WOA_PROJ}/repository/tree?path=${encodeURIComponent(d)}&ref=master&per_page=100`,{headers:hdr});
    if(r.ok){const tree=await r.json();return tree.filter(f=>f.type==='blob'&&f.name.endsWith('.json')&&f.name!=='manifest.json').map(f=>({name:f.name}))}
    // Fallback: manifest
    try{const r2=await fetch(`${WOA_API}/projects/${WOA_PROJ}/repository/files?file_path=${encodeURIComponent(d+'/manifest.json')}&ref=master`,{headers:hdr});
    if(r2.ok){const md=await r2.json();

      const files=JSON.parse(new TextDecoder('utf-8').decode(bytes));return files.map(name=>({name}))}
    }}catch(e){}
  }catch(e){}
  return[];
}
async function woaGet(p){
  const tk=localStorage.getItem('woa_token')||TK;
  const hdr=tk?{'PRIVATE-TOKEN':tk}:{};
  try{
    const r=await fetch(`${WOA_API}/projects/${WOA_PROJ}/repository/files?file_path=${encodeURIComponent(p)}&ref=master`,{headers:hdr});
    if(r.ok){const d=await r.json();
      if(d.content){
        const raw=atob(d.content);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
        const text=new TextDecoder('utf-8').decode(bytes);
        const result=JSON.parse(text.replace(/[\x00-\x1f]/g,c=>c==='\n'||c==='\r'||c==='\t'?c:''));
        console.log('woaGet OK:', p, 'name:', result.name, 'platforms:', (result.data||[]).length);
        return result;
      }
      // File too large for base64 API → auto-compress via archive
      console.log('woaGet: file too large, auto-compressing:', p);
      const repaired=await autoCompressFile(p);
      if(repaired)return repaired;
      console.error('woaGet: auto-compress failed for', p);
    }else{
      console.error('woaGet: HTTP', r.status, 'for', p);
    }
  }catch(e){console.error('woaGet error:', p, e)}
  return null;
}

async function autoCompressFile(path){
  // Download whole repo archive, extract the oversized file, compress images, re-upload
  const tk=localStorage.getItem('woa_token')||TK;
  if(!tk)return null;
  try{
    const ar=await fetch(`${WOA_API}/projects/${WOA_PROJ}/repository/archive?ref=master`,{headers:{'PRIVATE-TOKEN':tk}});
    if(!ar.ok)return null;
    const blob=await ar.blob();
    // Parse zip in browser
    const buf=await blob.arrayBuffer();
    const entries=await parseZip(buf);
    const fname=path.split('/').pop();
    // Find our file in zip entries
    let fileData=null;
    for(const [name,data] of entries){
      if(name.endsWith('/'+fname)||name.endsWith('/data/'+fname)){
        const raw=new TextDecoder('utf-8').decode(data).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');
        fileData=JSON.parse(raw);break;
      }
    }
    if(!fileData)return null;
    // Compress all images in the data
    for(const pd of(fileData.data||[])){for(const item of(pd.items||[])){
      if(item.imgs&&item.imgs.length){item.imgs=await compressImgs(item.imgs)}
    }}
    const compressed=JSON.stringify(fileData).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');
    console.log('autoCompressFile:', fname, 'compressed, re-uploading...');
    // Re-upload compressed version (PUT with file_path in URL)
    const hdr={'PRIVATE-TOKEN':tk,'Content-Type':'application/json'};
    const body={branch_name:'master',content:compressed,commit_message:'auto-compress oversized file'};
    const r=await fetch(`${WOA_API}/projects/${WOA_PROJ}/repository/files?file_path=${encodeURIComponent(path)}&ref=master`,{method:'PUT',headers:hdr,body:JSON.stringify(body)});
    if(r.ok){console.log('autoCompressFile: re-uploaded successfully');toast('已自动压缩并修复: '+fname);return fileData}
    else{const t=await r.text();console.error('autoCompressFile: upload failed',r.status,t);return fileData}
  }catch(e){console.error('autoCompressFile error:',e);return null}
}

async function parseZip(buf){
  // Minimal ZIP parser - extracts stored and deflated files
  const view=new DataView(buf);
  const entries=new Map();
  const uint8=new Uint8Array(buf);
  // Find End of Central Directory
  let eocd=-1;
  for(let i=buf.byteLength-22;i>=0;i--){
    if(view.getUint32(i,true)===0x06054b50){eocd=i;break}
  }
  if(eocd<0)return entries;
  const cdOffset=view.getUint32(eocd+16,true);
  const cdCount=view.getUint16(eocd+10,true);
  let off=cdOffset;
  for(let i=0;i<cdCount;i++){
    if(view.getUint32(off,true)!==0x02014b50)break;
    const method=view.getUint16(off+10,true);
    const compSize=view.getUint32(off+20,true);
    const uncompSize=view.getUint32(off+24,true);
    const nameLen=view.getUint16(off+28,true);
    const extraLen=view.getUint16(off+30,true);
    const commentLen=view.getUint16(off+32,true);
    const localOff=view.getUint32(off+42,true);
    const name=new TextDecoder().decode(uint8.slice(off+46,off+46+nameLen));
    // Read local file header to get data offset
    const lhNameLen=view.getUint16(localOff+26,true);
    const lhExtraLen=view.getUint16(localOff+28,true);
    const dataOff=localOff+30+lhNameLen+lhExtraLen;
    if(name.endsWith('/')){off+=46+nameLen+extraLen+commentLen;continue}
    let data;
    if(method===0){data=uint8.slice(dataOff,dataOff+uncompSize)}
    else if(method===8){
      // Inflate using DecompressionStream
      const cs=new DecompressionStream('deflate-raw');
      const writer=cs.writable.getWriter();
      writer.write(uint8.slice(dataOff,dataOff+compSize));
      writer.close();
      const reader=cs.readable.getReader();
      const chunks=[];
      while(true){const{done,value}=await reader.read();if(done)break;chunks.push(value)}
      const total=chunks.reduce((s,c)=>s+c.length,0);
      data=new Uint8Array(total);let pos=0;for(const c of chunks){data.set(c,pos);pos+=c.length}
    }else{off+=46+nameLen+extraLen+commentLen;continue}
    entries.set(name,data);
    off+=46+nameLen+extraLen+commentLen;
  }
  return entries;
}

function validateRequired(){
  const nameEl=document.getElementById('nameField');if(nameEl)cfg.name=nameEl.value.trim();
  if(!cfg.name) return '请输入姓名';
  const missing=[];
  cfg.platforms.forEach(plat=>{
    const pk=plat.replace(/[^a-zA-Z0-9]/g,'_');
    cfg.cases.forEach(caseId=>{
      if(caseId==='m1'){
        MULTI_ROUNDS.forEach((r,ri)=>{
          const base=pk+'_multi_r'+(ri+1);
          DIMS_3.forEach(d=>{if(scores[base+'_'+d.k]===undefined)missing.push(plat+' '+r.label+' '+d.name)});
          if(!fields[base+'_link'])missing.push(plat+' '+r.label+' 链接');
        });
      }else{
        const base=pk+'_'+caseId;
        const num=parseInt(caseId.slice(1));
        const isGdd=caseId.startsWith('g');
        const cObj=isGdd?GDD_CASES.find(x=>x.num===num):DIRECT_CASES.find(x=>x.num===num);
        DIMS_12.forEach(d=>{if(scores[base+'_'+d.k]===undefined)missing.push(plat+' '+(cObj?cObj.name:caseId)+' '+d.name)});
        if(!fields[base+'_link'])missing.push(plat+' '+(cObj?cObj.name:caseId)+' 链接');
      }
    });
  });
  const rk=getCaseRanking('global');
  if(!rk.length)missing.push('平台排名');
  if(missing.length) return '还有 '+missing.length+' 项未填：'+missing.slice(0,5).join('、')+(missing.length>5?'...':'');
  return '';
}
async function doSubmit(){
  const err=validateRequired();if(err){toast(err);return}
  const btn=document.getElementById('subBtn');btn.textContent='提交中…';btn.disabled=true;
  try{
  const result=await getMyData();
  // Sanitize JSON: remove control characters that break JSON.parse
  const raw=JSON.stringify(result,null,2);
  const clean=raw.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');
  const ok=await woaPut('data/'+cfg.name+'_'+Date.now()+'.json',clean);
  if(ok){btn.textContent='✓ 已提交';toast('已提交')}else{btn.textContent='提交';btn.disabled=false;toast('提交失败，请检查Token是否有效')}
  }catch(e){btn.textContent='提交';btn.disabled=false;toast('提交出错: '+e.message);console.error('doSubmit error',e)}
}
function compressImgs(imgs){
  return Promise.all(imgs.map(img=>new Promise(resolve=>{
    if(!img||typeof img!=='string'){resolve(img);return}
    const i=new Image();i.onload=()=>{const c=document.createElement('canvas');const maxW=400;let w=i.width,h=i.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);resolve(c.toDataURL('image/jpeg',0.6))};i.onerror=()=>resolve(img);i.src=img})));
}
async function getMyData(){
  const result={name:cfg.name,platforms:cfg.platforms,cases:cfg.cases,time:new Date().toISOString(),data:[],ranking:getCaseRanking('global')};
  cfg.platforms.forEach(plat=>{
    const pk=plat.replace(/[^a-zA-Z0-9]/g,'_');
    const pd={platform:plat,items:[]};
    cfg.cases.forEach(caseId=>{
      if(caseId==='m1'){
        MULTI_ROUNDS.forEach((r,ri)=>{
          const base=pk+'_multi_r'+(ri+1);
          const item={type:'multi',round:ri+1,roundLabel:r.label,scores:{},link:fields[base+'_link']||'',note:fields[base+'_n']||'',imgs:fields[base+'_imgs']||[]};
          DIMS_3.forEach(d=>{item.scores[d.k]=scores[base+'_'+d.k]});
          const v=Object.values(item.scores).filter(x=>x!==undefined&&x!==0);
          item.avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):'';
          pd.items.push(item);
        });
      }else{
        const base=pk+'_'+caseId;
        const isGdd=caseId.startsWith('g');
        const num=parseInt(caseId.slice(1));
        const cObj=isGdd?GDD_CASES.find(x=>x.num===num):DIRECT_CASES.find(x=>x.num===num);
        const item={type:isGdd?'gdd':'direct',name:cObj?cObj.name:'',caseId,scores:{},link:fields[base+'_link']||'',note:fields[base+'_n']||'',imgs:fields[base+'_imgs']||[]};
        DIMS_12.forEach(d=>{item.scores[d.k]=scores[base+'_'+d.k]});
        const v=Object.values(item.scores).filter(x=>x!==undefined&&x!==0);
        item.avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):'';
        pd.items.push(item);
      }
    });
    result.data.push(pd);
  });
  // 压缩所有图片
  for(const pd of result.data){for(const item of pd.items){if(item.imgs&&item.imgs.length){item.imgs=await compressImgs(item.imgs)}}}
  return result;
}

  // 计算全3分提交（所有case所有维度全是3）

function calcSubjectiveRank(rankData){
  const platScores={};
  rankData.forEach(d=>{const n=d.ranking.length;d.ranking.forEach(r=>{if(!platScores[r.platform])platScores[r.platform]={score:0,count:0};platScores[r.platform].score+=n-r.rank+1;platScores[r.platform].count++})});
  return Object.keys(platScores).map(p=>({platform:p,score:platScores[p].score,count:platScores[p].count,avg:platScores[p].count?(platScores[p].score/platScores[p].count).toFixed(2):'-'})).sort((a,b)=>parseFloat(b.avg)-parseFloat(a.avg));
}
function renderTargetAnalysis(title,data,dims){
  const isMulti=title.includes('多轮');
  const platStats={};
  // 构建测评人维度明细
  const evaluatorDetail=[];
  data.forEach(d=>{
    const ev={name:d.name,platforms:{}};
    (d.data||[]).forEach(pd=>{
      // 按目标类型过滤items
      const items=(pd.items||[]).filter(it=>isMulti?it.type==='multi':it.type!=='multi');
      if(!items.length)return;
      if(!platStats[pd.platform])platStats[pd.platform]={dimSums:{},dimCounts:{},totalScores:[],items:[]};
      const ps=platStats[pd.platform];
      dims.forEach(dim=>{if(!ps.dimSums[dim.k]){ps.dimSums[dim.k]=0;ps.dimCounts[dim.k]=0}});
      let pDimSums={},pDimCounts={},hasValid=false;
      items.forEach(item=>{
        const allMax=dims.every(dim=>{const v=(item.scores||{})[dim.k];return v===3});
        if(allMax)return;
        let it=0,ic=0;
        dims.forEach(dim=>{const v=(item.scores||{})[dim.k];if(v!==undefined&&v!==null&&v!==0){ps.dimSums[dim.k]+=v;ps.dimCounts[dim.k]++;pDimSums[dim.k]=(pDimSums[dim.k]||0)+v;pDimCounts[dim.k]=(pDimCounts[dim.k]||0)+1;it+=v;ic++}});
        if(ic){ps.totalScores.push(it/ic);hasValid=true}
        ps.items.push({...item,platform:pd.platform});
      });
      if(hasValid){
        const pScores={};
        dims.forEach(dim=>{if(pDimSums[dim.k]&&pDimCounts[dim.k])pScores[dim.k]=+(pDimSums[dim.k]/pDimCounts[dim.k]).toFixed(2)});
        const validAvgs=Object.values(pScores).filter(v=>typeof v==='number');
        pScores._avg=validAvgs.length?+(validAvgs.reduce((a,b)=>a+b,0)/validAvgs.length).toFixed(2):0;
        ev.platforms[pd.platform]=pScores;
      }
    });
    evaluatorDetail.push(ev);
  });
  const platforms=Object.keys(platStats);if(!platforms.length)return'';
  const avg=arr=>arr.length?(arr.reduce((a,b)=>a+b,0)/arr.length):0;
  const fmtA=v=>typeof v==='number'?v.toFixed(2):'-';
  const aid=isMulti?'a_multi':'a_gen';
  window[aid]={platStats,platforms,dims,title,data,evaluatorDetail};
  let h='<div class="s"><div class="sh"><div class="sn" style="background:var(--blue)">'+title[0]+'</div><div class="st">'+title+'</div></div><div class="analysis-grid">';
  const sorted=platforms.map(p=>({p,s:avg(platStats[p].totalScores)})).sort((a,b)=>b.s-a.s);
  h+='<div class="acard" onclick="showAnalysis(\''+aid+'\',\'rank\')"><div class="acard-title">平台综合排名</div><div class="acard-preview">'+sorted.slice(0,3).map((x,i)=>(i+1)+'. '+x.p+' '+fmtA(x.s)).join('<br>')+'</div></div>';
  h+='<div class="acard" onclick="showAnalysis(\''+aid+'\',\'heatmap\')"><div class="acard-title">维度强弱热力图</div><div class="acard-preview">各平台各维度得分着色对比</div></div>';
  h+='<div class="acard" onclick="showAnalysis(\''+aid+'\',\'bestworst\')"><div class="acard-title">单项最优/最差</div><div class="acard-preview">各维度冠军和短板一览</div></div>';
  if(title.includes('多轮')){h+='<div class="acard" onclick="showAnalysis(\''+aid+'\',\'trend\')"><div class="acard-title">多轮趋势分析</div><div class="acard-preview">3轮修改分数变化趋势</div></div>'}
  h+='</div></div>';
  return h;
}

      });h+='</table>';

      h+='<table class="dt"><tr><th>轮次</th>';DIMS_3.forEach(dim=>{h+='<th>'+dim.name+'</th>'});h+='<th>均分</th><th>链接</th><th>备注</th></tr>';

        h+='<td style="font-weight:700;color:var(--accent)">'+(item.avg||'-')+'</td><td style="font-size:11px;text-align:left">'+(item.link?'<a href="'+item.link+'" target="_blank" style="color:var(--blue)">'+item.link+'</a>':'-')+'</td><td style="font-size:11px;text-align:left">'+(item.note||'-')+'</td></tr>';
        if((item.imgs||[]).length){h+='<tr><td colspan="'+(DIMS_3.length+4)+'"><div style="display:flex;gap:6px;flex-wrap:wrap;padding:4px 0">';item.imgs.forEach(src=>{h+='<img src="'+src+'" style="width:80px;height:60px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer" onclick="viewImg(this.src)">'});h+='</div></td></tr>'}
      });h+='</table>';
    }
  });
  h+='<button style="margin-top:12px;padding:6px 14px;border:1px solid var(--border);background:var(--card);border-radius:5px;font-size:12px;cursor:pointer" onclick="loadSum()">返回</button>';
  document.getElementById('app').innerHTML=h;
}

function addImg(base,input){const file=input.files[0];if(file)readImg(base,file)}
function readImg(base,file){if(!file||!file.type.startsWith('image'))return;const reader=new FileReader();reader.onload=e=>{if(!fields[base+'_imgs'])fields[base+'_imgs']=[];if(fields[base+'_imgs'].length>=4){toast('最多4张');return}fields[base+'_imgs'].push(e.target.result);updateImgZone(base)};reader.readAsDataURL(file)}
function updateImgZone(base){const zone=document.querySelector('[data-imgbase="'+base+'"] .img-list');if(!zone)return;const imgs=fields[base+'_imgs']||[];let h='';imgs.forEach((src,ii)=>{h+='<div class="img-thumb"><img src="'+src+'"><div class="img-del" onclick="event.stopPropagation();rmImg(\''+base+'\','+ii+')">x</div></div>'});if(imgs.length<4){h+='<label class="img-add"><input type="file" accept="image/*" style="display:none" onchange="addImg(\''+base+'\',this)">+</label>'}zone.innerHTML=h}
function dropImg(e,base){e.preventDefault();e.stopPropagation();const file=e.dataTransfer.files[0];if(file)readImg(base,file)}
function rmImg(base,idx){if(fields[base+'_imgs'])fields[base+'_imgs'].splice(idx,1);updateImgZone(base)}
